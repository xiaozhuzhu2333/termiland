# 复制到 ~/.config/termiland/config.toml 后按需修改，所有字段均可省略

[ui]
left_width = 28   # 左栏宽度（列）
right_width = 44  # 右栏宽度（列）

[islands]
max = 3  # 岛数量上限

[[islands.items]]
name = "history"                  # 边框标题（可省略）
command = "tail -n 30 $HISTFILE"  # 岛内运行的命令
height = 12                       # 岛高度（行，可省略，省略则平分）
# live = false                   # 实时刷新开关（默认 false：中栏执行命令后刷新）

[[islands.items]]
name = "top"
command = "top"
height = 20
live = true  # true：命令持续输出，自身刷新（适合 top / tail -f）
