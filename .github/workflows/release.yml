name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: termiland-linux-x86_64-musl.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: termiland-linux-aarch64-musl.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: termiland-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Strip (Linux)
        if: runner.os == 'Linux'
        run: strip target/${{ matrix.target }}/release/termiland
      - name: Test
        run: cargo test --release --target ${{ matrix.target }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf ${{ matrix.artifact }} -C target/${{ matrix.target }}/release termiland
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/termiland.exe -DestinationPath ${{ matrix.artifact }}
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
