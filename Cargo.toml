[package]
name = "termiland"
version = "0.1.5"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
vt100 = "0.16.2"

[target.'cfg(windows)'.dependencies]
arboard = "3.6.1"

[package.metadata.release]
tag-name = "v{{version}}"
publish = false
